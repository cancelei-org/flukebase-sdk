name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify committed dist is up to date
        run: |
          git diff --exit-status -- dist || {
            echo "::error::dist/ is stale — run 'npm run build' and commit.";
            exit 1;
          }
